[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "pathsig-finance"
version = "0.1.0"
description = "Rough path signatures for financial time series: cross-sectional equity return prediction with interpretable features"
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.9"
authors = [{ name = "rxj0102" }]
keywords = ["finance", "signatures", "rough-paths", "machine-learning", "quantitative-finance"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Topic :: Scientific/Engineering :: Mathematics",
    "Topic :: Office/Business :: Financial",
]

dependencies = [
    "numpy>=1.24",
    "scipy>=1.10",
    "pandas>=2.0",
    "scikit-learn>=1.3",
    "statsmodels>=0.14",
    "matplotlib>=3.7",
    "seaborn>=0.12",
    "pyyaml>=6.0",
    "tqdm>=4.65",
]

[project.optional-dependencies]
gpu = ["torch>=2.0", "signatory>=1.2.6"]
dev = [
    "pytest>=7.4",
    "pytest-cov>=4.1",
    "black>=23.0",
    "ruff>=0.1",
    "mypy>=1.5",
    "jupyter>=1.0",
    "ipykernel>=6.0",
    "yfinance>=0.2",
]

[project.urls]
Homepage = "https://github.com/rxj0102/pathsig-finance"
Repository = "https://github.com/rxj0102/pathsig-finance"
Issues = "https://github.com/rxj0102/pathsig-finance/issues"

[tool.setuptools.packages.find]
where = ["."]
include = ["pathsig*", "data*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-v --tb=short"

[tool.black]
line-length = 100
target-version = ["py39"]

[tool.ruff]
line-length = 100
select = ["E", "F", "W", "I"]

[tool.mypy]
python_version = "3.9"
warn_return_any = true
warn_unused_configs = true
